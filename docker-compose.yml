services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: sparetrack-app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-sparetrack}
      DB_USERNAME: ${DB_USERNAME:-sparetrack_user}
      DB_PASSWORD: ${DB_PASSWORD:-sparetrack_pass}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    networks:
      - sparetrack-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: sparetrack-nginx
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sparetrack-network
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: sparetrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sparetrack}
      POSTGRES_USER: ${DB_USERNAME:-sparetrack_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sparetrack_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-sparetrack_user} -d ${DB_DATABASE:-sparetrack}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sparetrack-network

  redis:
    image: redis:7-alpine
    container_name: sparetrack-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sparetrack-network

  reverb:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: sparetrack-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_SERVER_PORT:-8085}:8080"
    env_file: .env
    volumes:
      - .:/var/www/html
    networks:
      - sparetrack-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: sparetrack-worker
    restart: unless-stopped
    command: php artisan queue:work redis --tries=3 --timeout=90 --sleep=3
    env_file: .env
    environment:
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-sparetrack}
      DB_USERNAME: ${DB_USERNAME:-sparetrack_user}
      DB_PASSWORD: ${DB_PASSWORD:-sparetrack_pass}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
    volumes:
      - .:/var/www/html
    networks:
      - sparetrack-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  adminer:
    image: adminer:latest
    container_name: sparetrack-adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8088}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    networks:
      - sparetrack-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  sparetrack-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
