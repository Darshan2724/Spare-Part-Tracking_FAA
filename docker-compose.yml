services:
  app:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: sparetrack-app
    restart: unless-stopped
    env_file: .env
    environment:
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-sparetrack}
      DB_USERNAME: ${DB_USERNAME:-sparetrack_user}
      DB_PASSWORD: ${DB_PASSWORD:-sparetrack_pass}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
    volumes:
      - .:/var/www/html
      - /var/www/html/vendor
      - /var/www/html/node_modules
    networks:
      - sparetrack-network
    depends_on:
      - postgres
      - redis

  nginx:
    image: nginx:alpine
    container_name: sparetrack-nginx
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - sparetrack-network
    depends_on:
      - app

  postgres:
    image: postgres:16-alpine
    container_name: sparetrack-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_DATABASE:-sparetrack}
      POSTGRES_USER: ${DB_USERNAME:-sparetrack_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sparetrack_pass}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sparetrack-network

  redis:
    image: redis:7-alpine
    container_name: sparetrack-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - sparetrack-network

  reverb:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: sparetrack-reverb
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    ports:
      - "${REVERB_SERVER_PORT:-8085}:8080"
    env_file: .env
    volumes:
      - .:/var/www/html
    networks:
      - sparetrack-network
    depends_on:
      - app
      - redis

  worker:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    container_name: sparetrack-worker
    restart: unless-stopped
    command: php artisan queue:work redis --tries=3 --timeout=90 --sleep=3
    env_file: .env
    environment:
      DB_CONNECTION: ${DB_CONNECTION:-pgsql}
      DB_HOST: postgres
      DB_PORT: ${DB_PORT:-5432}
      DB_DATABASE: ${DB_DATABASE:-sparetrack}
      DB_USERNAME: ${DB_USERNAME:-sparetrack_user}
      DB_PASSWORD: ${DB_PASSWORD:-sparetrack_pass}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT:-6379}
    volumes:
      - .:/var/www/html
    networks:
      - sparetrack-network
    depends_on:
      - app
      - redis
      - postgres

  mailpit:
    image: axllent/mailpit:latest
    container_name: sparetrack-mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
      - "1025:1025"
    networks:
      - sparetrack-network

networks:
  sparetrack-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
